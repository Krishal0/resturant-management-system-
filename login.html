<!-- HTML FILE (index.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="logo">
        <div class="logo-circle"></div>
        <h2>Nepdine</h2>
      </div>

      <h1 class="welcome-title">WELCOME <span class="highlight">BACK</span></h1>
      <p class="subtitle">Welcome back! Please enter your details.</p>

      <div class="input ">
            <label class="email">Email</label>
            <input type="email" placeholder="Enter your email" class="input-box"/>
            <label class="email">Password</label>
            <input type="password" placeholder="********" class="input-box"/>
        </div>

      <div class="small-row">
        <div class="remember-me">
          <label for="remember-me">Remember me</label>
        <input type="checkbox" id="remember-me" />
        </div>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn-login">Login</button>

      <div class="auth-section">

    <div class="divider">
        <span>or</span>
    </div>

    <button class="google-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
        Sign in with Google
    </button>

    <p class="signup-text">
        Don't have an account?
        <a href="#">Sign up</a>
    </p>
    
   </div>

  </div>

   </div>

    
  </div>
</body>
</html>
